name: 🔄 Sync upstream

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: write

concurrency:
  group: upstream-sync-${{ github.repository }}
  cancel-in-progress: false

jobs:
  sync:
    name: Sync upstream main
    if: ${{ github.event.repository.fork }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Sync fork with upstream
        id: sync
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          before_sha="$(gh api "repos/${GH_REPO}/commits/main" --jq '.sha')"
          echo "Current main: ${before_sha}"

          gh api \
            --method POST \
            "repos/${GH_REPO}/merge-upstream" \
            --field branch=main

          after_sha="$(gh api "repos/${GH_REPO}/commits/main" --jq '.sha')"
          echo "Updated main: ${after_sha}"

          changed=false
          if [[ "${before_sha}" != "${after_sha}" ]]; then
            changed=true
          fi

          {
            echo "changed=${changed}"
            echo "before_sha=${before_sha}"
            echo "after_sha=${after_sha}"
          } >> "${GITHUB_OUTPUT}"

      - name: Trigger Cloudflare deployment
        if: steps.sync.outputs.changed == 'true' && vars.AUTO_DEPLOY == 'true'
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-cloudflare.yml --repo "${GH_REPO}" --ref main

      - name: Write summary
        env:
          AUTO_DEPLOY: ${{ vars.AUTO_DEPLOY }}
          AFTER_SHA: ${{ steps.sync.outputs.after_sha }}
          BEFORE_SHA: ${{ steps.sync.outputs.before_sha }}
          CHANGED: ${{ steps.sync.outputs.changed }}
        shell: bash
        run: |
          {
            echo "## Upstream sync"
            echo ""
            echo "- Before: \`${BEFORE_SHA}\`"
            echo "- After: \`${AFTER_SHA}\`"
            echo "- Changed: \`${CHANGED}\`"
            echo "- Auto deploy enabled: \`${AUTO_DEPLOY:-false}\`"
          } >> "${GITHUB_STEP_SUMMARY}"
